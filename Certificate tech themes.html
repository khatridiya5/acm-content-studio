<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate themes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Chakra+Petch:wght@500;600;700&family=Fraunces:wght@500;600&family=Sora:wght@500;600&family=Outfit:wght@500;600&family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pb:#f4f5f7;--pi:#111827;--pc:#fff;--pl:#d8dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pb:#0f1115;--pi:#e5e7eb;--pc:#1a1d24;--pl:#2c313b}}
:root[data-theme="dark"]{--pb:#0f1115;--pi:#e5e7eb;--pc:#1a1d24;--pl:#2c313b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pb);color:var(--pi);font-family:'IBM Plex Sans',Arial,sans-serif}
header{padding:24px 24px 8px}h1{margin:0 0 4px;font-size:20px}header p{margin:0 0 16px;font-size:14px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--pl);background:var(--pc);color:var(--pi);border-radius:999px;font:500 14px 'IBM Plex Sans',Arial,sans-serif;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--pi);color:var(--pb)}
.chips i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--pl)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:20px;padding:16px 24px 32px}
figure{margin:0;background:var(--pc);border:1px solid var(--pl);border-radius:10px;padding:10px}
figcaption{font-size:13px;padding:8px 2px 0;opacity:.8}
.w{position:relative;width:100%;aspect-ratio:1123/794;overflow:hidden;border-radius:4px}
.w .c{position:absolute;left:0;top:0;transform-origin:0 0}
.c{position:relative;width:1123px;height:794px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}
.c *{box-sizing:border-box}.abs{position:absolute}.row{display:flex}.col{display:flex;flex-direction:column;align-items:center;text-align:center}
.mono{font-family:'IBM Plex Mono',monospace}.fd{font-family:var(--fd)}
.c b{font-weight:700}.d b{color:var(--a)}
.ph{position:absolute;border:1px dashed var(--ink);opacity:.55;display:flex;align-items:center;justify-content:center;text-align:center;font:500 10px 'IBM Plex Mono',monospace}
.q{background:#fff;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font:500 11px 'IBM Plex Mono',monospace;color:#475569}
.sg{position:relative;padding-top:10px}.sg:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--ink);opacity:.5}
.sg b{display:block;font:600 var(--sf,14px) 'IBM Plex Sans'}.sg i{display:block;font:400 calc(var(--sf,14px) - 3px) 'IBM Plex Sans';font-style:normal;opacity:.75}
</style>
</head>
<body>
<header><h1>Certificate themes × 5 designs</h1><p>Pick a tech theme: each one changes the palette, display font and a subtle tech motif (neural net, binary, code brackets, charts, clouds, git graph). Layouts stay the same.</p><div class="chips" id="chips"></div></header>
<main id="grid"></main>
<script>
const T=[
{k:'Default',fd:"'Playfair Display',serif",L:['#fbfaf6','#111827','#1e3a8a','#4a76a8','#cbd5e1'],D:['#0b1220','#e5e7eb','#7dd3fc','#38bdf8','#334155']},
{k:'AI / ML',fd:"'Space Grotesk',sans-serif",L:['#f7f6ff','#1b1633','#6d28d9','#a78bfa','#ddd6fe'],D:['#120d2b','#ede9fe','#c4b5fd','#8b5cf6','#3b2f73']},
{k:'Cybersecurity',fd:"'Chakra Petch',sans-serif",L:['#f3f6f4','#0f1a14','#0b7a43','#34d399','#c5d8cd'],D:['#050d09','#d1fae5','#22c55e','#16a34a','#14532d']},
{k:'Web Dev',fd:"'Sora',sans-serif",L:['#fffaf7','#1a1423','#c2380f','#264de4','#ecd9d0'],D:['#14101f','#f5efe9','#ff7a45','#6b8cff','#3a2f55']},
{k:'Data Science',fd:"'Fraunces',serif",L:['#f4f8fb','#0b2239','#0e7490','#f59e0b','#cfe0ea'],D:['#08202b','#e0f2fe','#22d3ee','#fbbf24','#1e4a5c']},
{k:'Cloud / DevOps',fd:"'Outfit',sans-serif",L:['#f4f9fd','#10243a','#0369a1','#f97316','#cfe0f2'],D:['#08192b','#e6f1ff','#38bdf8','#fb923c','#1f3a5f']},
{k:'Open Source',fd:"'IBM Plex Mono',monospace",L:['#f6f6f3','#1c1c1a','#1a7f37','#8250df','#d0d7de'],D:['#0d1117','#e6edf3','#3fb950','#a371f7','#30363d']}];
const P=`For being selected as a finalist in <b>HackNova 2026</b>, organized by XYZ Coding Club, XYZ College of Engineering, from 11th July to 2nd August 2026.`;
const ph=(s,t)=>`<div class="ph" style="${s}">${t}</div>`;
const sg=(w,f)=>`<div class="sg" style="width:${w}px;${f?'--sf:'+f+'px':''}"><b>[Signatory name]</b><i>[Role]</i></div>`;
const qr=(s,st)=>`<div class="q" style="width:${s}px;height:${s}px;${st||''}">QR</div>`;
const V=st=>`<div class="abs mono" style="${st};font-size:10px;opacity:.75">Verify at [your-domain]/verify/CC-2026-0001</div>`;
const idc=`<div class="mono" style="font-size:10px;margin-top:8px;opacity:.75">ID: CC-2026-0001</div>`;
const cor=(p,c)=>`<div class="abs" style="${p};width:190px;height:190px;background:var(--b);clip-path:${c}"></div><div class="abs" style="${p};width:125px;height:125px;background:var(--a);clip-path:${c}"></div>`;
const R=i=>Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
const net=pts=>{let s='';for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1];if(dx*dx+dy*dy<22500)s+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}"/>`}return s+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')};
const bin=(n,s)=>Array.from({length:n},(_,i)=>R(i+s)>.5?1:0).join('');
const cloud=st=>`<div class="abs" style="${st};width:260px;height:160px;opacity:.09"><div class="abs" style="left:0;bottom:0;width:260px;height:60px;border-radius:30px;background:var(--a)"></div><div class="abs" style="left:40px;bottom:30px;width:90px;height:90px;border-radius:50%;background:var(--a)"></div><div class="abs" style="left:100px;bottom:30px;width:120px;height:120px;border-radius:50%;background:var(--a)"></div></div>`;
const decor=k=>{
if(k=='AI / ML')return `<svg class="abs" width="1123" height="794" style="left:0;top:0;opacity:.32;stroke:var(--a);fill:var(--a);stroke-width:1">`+net([[30,40],[110,70],[60,130],[150,150],[20,200],[110,230],[1040,30],[1090,90],[980,60],[1000,560],[1080,600],[1040,660],[960,640],[1090,720],[990,730],[30,600],[110,640],[60,720],[150,700]])+`</svg>`;
if(k=='Cybersecurity')return [14,1039].map((x,i)=>`<div class="abs mono" style="left:${x}px;top:0;width:70px;height:794px;overflow:hidden;word-break:break-all;font-size:12px;line-height:14px;color:var(--a);opacity:.15">${bin(700,i*50+1)}</div>`).join('');
if(k=='Web Dev')return `<div class="abs mono" style="right:-20px;top:-30px;font-size:230px;font-weight:600;color:var(--a);opacity:.07;line-height:1">&lt;/&gt;</div><div class="abs mono" style="left:-10px;bottom:-60px;font-size:230px;font-weight:600;color:var(--b);opacity:.08;line-height:1">{ }</div>`;
if(k=='Data Science')return `<div class="abs row" style="left:0;right:0;bottom:0;height:170px;align-items:flex-end;gap:14px;padding:0 14px;opacity:.12">`+Array.from({length:40},(_,i)=>`<div style="flex:1;height:${30+R(i)*110}px;background:var(--${i%3?'a':'b'})"></div>`).join('')+`</div>`;
if(k=='Cloud / DevOps')return cloud('right:110px;top:30px')+cloud('left:100px;bottom:140px;transform:scale(.7)');
if(k=='Open Source')return `<svg class="abs" width="60" height="794" style="left:0;top:0;opacity:.5;fill:none;stroke-width:2"><path d="M14 0V794" style="stroke:var(--a)"/><path d="M14 260C14 290 34 280 34 310V370C34 400 14 390 14 420" style="stroke:var(--b)"/>`+[120,260,420,560,690].map(y=>`<circle cx="14" cy="${y}" r="5" style="fill:var(--bg);stroke:var(--a)"/>`).join('')+`<circle cx="34" cy="340" r="5" style="fill:var(--bg);stroke:var(--b)"/></svg>`;
return '';};
const D=[
{n:'Classic Ivory',dark:0,h:()=>`<div class="abs" style="inset:38px;border:2px solid var(--a)"></div><div class="abs" style="inset:49px;border:1px solid var(--a);opacity:.55"></div>${ph('left:90px;top:76px;width:76px;height:76px','CLUB<br>LOGO')}${ph('left:957px;top:76px;width:76px;height:76px','COLLEGE<br>LOGO')}
<div class="abs col" style="left:0;right:0;top:92px"><div class="mono" style="font-size:24px;font-weight:600;color:var(--a)">&lt;/&gt;</div><div style="margin-top:6px;font:600 13px 'IBM Plex Sans';letter-spacing:.2em;opacity:.8">XYZ CODING CLUB</div>
<div class="fd" style="margin-top:48px;font-size:60px;font-weight:600;letter-spacing:.12em;line-height:1.2">CERTIFICATE</div><div style="margin-top:10px;font:600 14px 'IBM Plex Sans';letter-spacing:.26em;color:var(--a)">OF ACHIEVEMENT</div>
<div class="fd" style="margin-top:36px;font-size:19px;font-style:italic;opacity:.75">This certificate is proudly presented to</div><div class="fd" style="margin-top:18px;font-size:84px;font-weight:600;line-height:1.1">Aarav Mehta</div>
<div style="margin-top:14px;width:226px;height:2px;background:var(--a)"></div><div style="margin-top:24px;max-width:640px;font:400 16px/1.65 'IBM Plex Sans';opacity:.9">${P}</div></div>
<div class="abs row" style="left:159px;right:159px;bottom:84px;justify-content:space-between;align-items:flex-end;text-align:center">${sg(212)}<div class="col">${qr(60)}${idc}</div>${sg(212)}</div>${V('left:0;right:0;bottom:58px;text-align:center')}`},
{n:'Editorial White',dark:0,h:()=>`<div class="abs" style="left:0;top:0;width:30px;height:794px;background:var(--a)"></div>${ph('left:113px;top:64px;width:68px;height:68px','CLUB<br>LOGO')}${ph('left:200px;top:64px;width:68px;height:68px','COLLEGE<br>LOGO')}<div class="abs mono" style="right:102px;top:80px;font-size:11px;opacity:.75">ID: CC-2026-0001</div>
<div class="abs" style="left:113px;right:100px;top:150px"><div class="mono" style="font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--a)">XYZ CODING CLUB</div><div class="fd" style="margin-top:22px;font-size:72px;font-weight:600;letter-spacing:.1em;line-height:1.2">CERTIFICATE</div>
<div style="margin-top:10px;font:600 14px 'IBM Plex Sans';letter-spacing:.26em;color:var(--a)">OF ACHIEVEMENT</div><div style="margin-top:36px;font-size:17px;opacity:.75">This certificate is proudly presented to</div><div class="fd" style="margin-top:18px;font-size:98px;font-weight:600;line-height:1.1">Aarav Mehta</div>
<div style="margin-top:12px;width:226px;height:4px;background:var(--a)"></div><div style="margin-top:24px;max-width:700px;font:400 17px/1.65 'IBM Plex Sans';opacity:.9">${P}</div></div>
<div class="abs row" style="left:113px;bottom:40px;gap:83px">${sg(212)}${sg(212)}</div><div class="abs col" style="right:90px;bottom:90px;gap:8px">${qr(91)}<div class="mono" style="font-size:10px;opacity:.75">Scan to verify</div></div>`},
{n:'Night Slate',dark:1,h:()=>`<div class="abs" style="left:0;top:0;width:1123px;height:5px;background:var(--a)"></div><div class="abs" style="left:0;bottom:0;width:1123px;height:5px;background:var(--a)"></div>${ph('left:90px;top:56px;width:68px;height:68px','CLUB<br>LOGO')}${ph('left:965px;top:56px;width:68px;height:68px','COLLEGE<br>LOGO')}
<div class="abs mono" style="left:0;right:0;top:84px;text-align:center;font-size:13px;letter-spacing:.2em;color:var(--a)">XYZ CODING CLUB</div><div class="abs" style="left:90px;right:90px;top:159px;border-top:1px solid var(--ln)"></div>
<div class="abs col" style="left:0;right:0;top:200px"><div class="fd" style="font-size:60px;font-weight:500;letter-spacing:.12em;line-height:1.2">CERTIFICATE</div><div class="mono" style="margin-top:10px;font-size:14px;letter-spacing:.3em;color:var(--a)">OF ACHIEVEMENT</div>
<div style="margin-top:38px;font-size:16px;opacity:.75">This certificate is proudly presented to</div><div style="margin-top:18px;font:600 90px 'IBM Plex Sans';line-height:1.1">Aarav Mehta</div><div style="margin-top:22px;max-width:700px;font:400 16px/1.65 'IBM Plex Sans';opacity:.9">${P}</div></div>
<div class="abs" style="left:90px;right:90px;top:612px;border-top:1px solid var(--ln)"></div><div class="abs row" style="left:159px;right:159px;bottom:80px;justify-content:space-between;align-items:flex-end;text-align:center">${sg(212)}<div class="col">${qr(60)}${idc}</div>${sg(212)}</div>${V('left:0;right:0;bottom:36px;text-align:center')}`},
{n:'Geometric Blue',dark:0,h:()=>cor('left:0;top:0','polygon(0 0,100% 0,0 100%)')+cor('right:0;top:0','polygon(0 0,100% 0,100% 100%)')+cor('left:0;bottom:0','polygon(0 0,0 100%,100% 100%)')+cor('right:0;bottom:0','polygon(100% 0,100% 100%,0 100%)')+`
<div class="abs col" style="left:0;right:0;top:36px"><div class="row" style="align-items:center;gap:28px;position:relative;width:196px;height:84px"><div class="ph" style="left:0;top:0;width:84px;height:84px">CLUB<br>LOGO</div><div style="position:absolute;left:97px;top:0;width:2px;height:84px;background:var(--a)"></div><div class="ph" style="left:112px;top:0;width:84px;height:84px">COLLEGE<br>LOGO</div></div>
<div class="fd" style="margin-top:14px;font-size:92px;font-weight:600;color:var(--a);line-height:1.05;letter-spacing:.03em">CERTIFICATE</div><div style="margin-top:2px;font:700 34px 'IBM Plex Sans'">Of Achievement</div><div style="margin-top:24px;font-size:20px">This certificate is proudly presented to</div>
<div class="fd" style="margin-top:22px;font-size:56px;font-weight:500;color:var(--a);line-height:1.1">Aarav Mehta</div><div class="row" style="margin-top:16px;width:600px;align-items:center"><div style="width:10px;height:10px;transform:rotate(45deg);background:var(--a)"></div><div style="flex:1;height:2px;background:var(--a)"></div><div style="width:10px;height:10px;transform:rotate(45deg);background:var(--a)"></div></div>
<div style="margin-top:20px;max-width:820px;font:400 21px/1.55 'IBM Plex Sans'">${P}</div></div>${qr(96,'position:absolute;right:56px;top:200px')}
<div class="abs row" style="left:200px;right:200px;bottom:70px;justify-content:space-between;text-align:center">${sg(260,17)}${sg(260,17)}</div>${V('left:0;right:0;bottom:22px;text-align:center')}`},
{n:'Blueprint',dark:1,h:()=>`<div class="abs" style="inset:0;opacity:.35;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:40px 40px"></div><div class="abs" style="inset:34px;border:1px solid var(--a);opacity:.45"></div>${ph('left:90px;top:70px;width:64px;height:64px','CLUB<br>LOGO')}${ph('left:168px;top:70px;width:64px;height:64px','COLLEGE<br>LOGO')}
<div class="abs col" style="right:90px;top:64px;width:124px;height:124px;border:1px solid var(--a);border-radius:50%;justify-content:center"><div class="col" style="width:100px;height:100px;border:1px dashed var(--a);border-radius:50%;justify-content:center;gap:4px;color:var(--a)"><div class="mono" style="font-size:22px;font-weight:600">&lt;/&gt;</div><div class="mono" style="font-size:9px;letter-spacing:.2em">CERTIFIED</div></div></div>
<div class="abs" style="left:90px;right:90px;top:170px"><div class="mono" style="font-size:13px;letter-spacing:.2em;color:var(--a)">XYZ CODING CLUB</div><div class="fd" style="margin-top:18px;font-size:64px;font-weight:600;letter-spacing:.06em;line-height:1.2">CERTIFICATE</div><div class="mono" style="margin-top:10px;font-size:14px;letter-spacing:.3em;color:var(--a)">OF ACHIEVEMENT</div>
<div style="margin-top:32px;font-size:16px;opacity:.8">This certificate is proudly presented to</div><div class="fd" style="margin-top:14px;font-size:84px;font-weight:600;line-height:1.1">Aarav Mehta</div><div class="row" style="margin-top:14px;align-items:center"><div style="width:8px;height:8px;background:var(--a)"></div><div style="flex:1;height:1px;background:var(--a);opacity:.6"></div></div>
<div style="margin-top:22px;max-width:760px;font:400 18px/1.65 'IBM Plex Sans';opacity:.92">${P}</div></div><div class="abs row" style="left:90px;bottom:84px;gap:70px">${sg(220)}${sg(220)}</div>${qr(90,'position:absolute;right:90px;bottom:84px')}${V('left:90px;bottom:52px')}`}];
let cur=0;const grid=document.getElementById('grid'),chips=document.getElementById('chips');
const cert=(d,t)=>{const m=d.dark?t.D:t.L;return `<div class="c${d.dark?' d':''}" style="--bg:${m[0]};--ink:${m[1]};--a:${m[2]};--b:${m[3]};--ln:${m[4]};--fd:${t.fd}">${decor(t.k)}${d.h()}</div>`};
const fit=()=>document.querySelectorAll('.w').forEach(w=>{w.firstChild.style.transform=`scale(${w.clientWidth/1123})`});
const render=()=>{const t=T[cur];grid.innerHTML=D.map((d,i)=>`<figure><div class="w">${cert(d,t)}</div><figcaption>${i+1} · ${d.n} · ${t.k}</figcaption></figure>`).join('');fit();
chips.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i==cur))};
T.forEach((t,i)=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${t.L[2]}"></i>${t.k}`;b.onclick=()=>{cur=i;render()};chips.appendChild(b)});
addEventListener('resize',fit);render();
</script>
</body>
</html>
